AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: This serverless application publishes AWS Route 53 events to NS1 Connect.
Globals:
  Function:
    Timeout: 10
    Tracing: Active
  Api:
    TracingEnabled: true
Metadata:
  AWS::ServerlessRepo::Application:
    Name: aws-route53-ns1-connect
    Description: This serverless application publishes AWS Route 53 events to NS1
      Connect.
    Author: NS1
    SpdxLicenseId: Apache-2.0
    LicenseUrl: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/86d3f3a95c324c9479bd8986968f4327
    ReadmeUrl: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/16efd6fc765d483c4867e59be0268e3b
    Labels:
    - serverless
    - NS1
    - Route53
    - DNS
    HomePageUrl: https://github.com/ns1/cloudsync
    SemanticVersion: '0.4.1'
    SourceCodeUrl: https://github.com/ns1/cloudsync/tree/0.4.1
Parameters:
  CloudTrailName:
    Type: String
    Default: CloudSyncTrail
  EnableZoneOmission:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Indicate whether you would like to be able to omit certain zones
      from syncing. Enabled by default.
  ZoneSyncTag:
    Type: String
    Default: CloudSync
    MaxLength: 128
    Description: The tag that will indicate which zones are synced.
  SyncDestination:
    Type: String
    Default: ns1
    Description: The sync destination for cloudsync.
    AllowedValues:
    - ns1
    - s3
  SyncBucket:
    Type: String
    Default: ''
    Description: The sync s3 bucket when SyncDestination is set to 's3'.
  GatewayEndpoint:
    Type: String
    Description: Cloud sync gateway endpoint.
  NS1APIKey:
    Type: String
    Description: NS1 account API key.
Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: Route53_Snapshot_DLQ
    Metadata:
      SamResourceId: DeadLetterQueue
  DNSUpdateQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: Route53_Snapshot
    Metadata:
      SamResourceId: DNSUpdateQueue
  TrailKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Id: default-key-policy
        Statement:
        - Sid: Enable IAM User Permissions
          Effect: Allow
          Action:
          - kms:*
          Principal:
            AWS:
              Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
          Resource: '*'
        - Sid: Allow CloudTrail to encrypt logs
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action:
          - kms:GenerateDataKey*
          Resource: '*'
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/${CloudTrailName}
            StringLike:
              kms:EncryptionContext:aws:cloudtrail:arn:
                Fn::Sub: arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
        - Sid: Allow CloudTrail to describe key
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action:
          - kms:DescribeKey
          Resource: '*'
        - Sid: Allow principals in the account to decrypt log files
          Effect: Allow
          Principal:
            AWS: '*'
          Action:
          - kms:Decrypt
          - kms:ReEncryptFrom
          Resource: '*'
          Condition:
            StringEquals:
              kms:CallerAccount:
                Fn::Sub: ${AWS::AccountId}
            StringLike:
              kms:EncryptionContext:aws:cloudtrail:arn:
                Fn::Sub: arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
        - Sid: Allow alias creation during setup
          Effect: Allow
          Principal:
            AWS: '*'
          Action:
          - kms:CreateAlias
          Resource: '*'
          Condition:
            StringEquals:
              kms:CallerAccount:
                Fn::Sub: ${AWS::AccountId}
              kms:ViaService: ec2.us-east-1.amazonaws.com
        - Sid: Enable cross account log decryption
          Effect: Allow
          Principal:
            AWS: '*'
          Action:
          - kms:Decrypt
          - kms:ReEncryptFrom
          Resource: '*'
          Condition:
            StringEquals:
              kms:CallerAccount:
                Fn::Sub: ${AWS::AccountId}
            StringLike:
              kms:EncryptionContext:aws:cloudtrail:arn:
                Fn::Sub: arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
    Metadata:
      SamResourceId: TrailKMSKey
  TrailS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName:
        Fn::Join:
        - '-'
        - - cloudsync-trail-bucket
          - Fn::Select:
            - 4
            - Fn::Split:
              - '-'
              - Fn::Select:
                - 2
                - Fn::Split:
                  - /
                  - Ref: AWS::StackId
    Metadata:
      SamResourceId: TrailS3Bucket
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: TrailS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: Check ACLs
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:GetBucketAcl
          Resource:
            Fn::GetAtt:
            - TrailS3Bucket
            - Arn
          Condition:
            StringEquals:
              aws:SourceArn:
                Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/${CloudTrailName}
        - Sid: Write Access
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:PutObject
          Resource:
            Fn::Sub:
            - arn:aws:s3:::${Bucket}/AWSLogs/${AWS::AccountId}/*
            - Bucket:
                Ref: TrailS3Bucket
          Condition:
            StringEquals:
              s3:x-amz-acl: bucket-owner-full-control
    Metadata:
      SamResourceId: TrailBucketPolicy
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      S3BucketName:
        Ref: TrailS3Bucket
      IsLogging: true
      TrailName:
        Ref: CloudTrailName
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      KMSKeyId:
        Fn::GetAtt:
        - TrailKMSKey
        - Arn
    Metadata:
      SamResourceId: Trail
  EventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        account:
        - Fn::Sub: ${AWS::AccountId}
        source:
        - aws.route53
        detail:
          eventSource:
          - route53.amazonaws.com
          eventName:
          - CreateHostedZone
          - DeleteHostedZone
          - UpdateHostedZoneComment
          - ChangeResourceRecordSets
          - ChangeTagsForResource
          - CreateHealthCheck
          - DeleteHealthCheck
          - UpdateHealthCheck
          errorCode:
          - exists: false
      Targets:
      - Arn:
          Fn::GetAtt:
          - DNSUpdateQueue
          - Arn
        Id: DNSUpdateQueue
    Metadata:
      SamResourceId: EventRule
  EventBridgeToUpdateQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: DNSUpdateQueue
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action:
          - SQS:SendMessage
          Resource:
            Fn::GetAtt:
            - DNSUpdateQueue
            - Arn
    Metadata:
      SamResourceId: EventBridgeToUpdateQueuePolicy
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: SharedLayer
      Description: Common functions
      ContentUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/bf956fb1d7dc5307713a4031dd3720d5
      CompatibleRuntimes:
      - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11
      SamResourceId: SharedLayer
  DNSUpdateFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CloudSyncLambdaExecRole
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey*
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken*
          - Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - DeadLetterQueue
              - Arn
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - DNSUpdateQueue
              - Arn
          - Effect: Allow
            Action:
            - route53:GetHostedZone
            - route53:ListHostedZones
            - route53:ListResourceRecordSets
            - route53:ListTagsForResources
            Resource: '*'
          - Effect: Allow
            Action:
            - route53:ListTagsForResource
            Resource: '*'
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              Fn::GetAtt:
              - SnapshotStateMachine
              - Arn
    Metadata:
      SamResourceId: DNSUpdateFunctionRole
  EventLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: DNSUpdateFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - EventRule
        - Arn
    Metadata:
      SamResourceId: EventLambdaInvokePermission
  DNSUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DNSUpdateFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/434af26db43429dc699aecfda8401b86
      Handler: app.handler
      Runtime: python3.11
      Timeout: 10
      Role:
        Fn::GetAtt:
        - DNSUpdateFunctionRole
        - Arn
      Environment:
        Variables:
          ENDPOINT:
            Ref: GatewayEndpoint
          ACCOUNT_ID:
            Ref: AWS::AccountId
          ENABLE_ZONE_OMIT:
            Ref: EnableZoneOmission
          ZONE_SYNC_TAG:
            Ref: ZoneSyncTag
          SYNC_DEST:
            Ref: SyncDestination
          STATE_MACHINE_ARN:
            Fn::GetAtt:
            - SnapshotStateMachine
            - Arn
      Layers:
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
      - Ref: SharedLayer
      EventInvokeConfig:
        MaximumRetryAttempts: 2
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - DeadLetterQueue
          - Arn
      Events:
        UpdateQueueEvent:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - DNSUpdateQueue
              - Arn
            BatchSize: 5
    Metadata:
      SamResourceId: DNSUpdateFunction
  ConfigureFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CloudSyncConfigFunctionRole
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            - secretsmanager:DeleteSecret
            - secretsmanager:TagResource
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*
          - Effect: Allow
            Action: cloudformation:DescribeStackResources
            Resource:
              Fn::Sub: arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Effect: Allow
            Action: logs:DeleteLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*ConfigureFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*SnapshotFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*SnapshotListFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*TriggerStateMachineFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*DNSUpdateFunction*
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
            Resource:
              Fn::GetAtt:
              - TrailS3Bucket
              - Arn
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
            Resource:
              Fn::Sub:
              - arn:aws:s3:::${Bucket}/*
              - Bucket:
                  Ref: TrailS3Bucket
    Metadata:
      SamResourceId: ConfigureFunctionRole
  ConfigureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ConfigureFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/ac59d8dffc9b9342b6c3c723c3d3d92a
      Handler: app.configure_application
      Runtime: python3.11
      Timeout: 300
      Role:
        Fn::GetAtt:
        - ConfigureFunctionRole
        - Arn
      Layers:
      - Ref: SharedLayer
      Environment:
        Variables:
          NS1_API_KEY:
            Ref: NS1APIKey
          CLOUDSYNC_API_KEY: ''
          STACK_NAME:
            Ref: AWS::StackName
    Metadata:
      SamResourceId: ConfigureFunction
  ConfigureCustomResource:
    Type: Custom::ConfigureFunction
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - ConfigureFunction
        - Arn
      CloudTrailBucketName:
        Ref: TrailS3Bucket
    Metadata:
      SamResourceId: ConfigureCustomResource
  SnapshotFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SnapshotFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SnapshotFunctionRole
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - route53:GetHostedZone
            - route53:ListHostedZones
            - route53:ListResourceRecordSets
            - route53:ListTagsForResources
            Resource: '*'
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*
    Metadata:
      SamResourceId: SnapshotFunctionRole
  SnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SnapshotFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/fe2418a273db0b2bd75ada28f0838df6
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 60
      Role:
        Fn::GetAtt:
        - SnapshotFunctionRole
        - Arn
      Layers:
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
      - Ref: SharedLayer
      Environment:
        Variables:
          ENDPOINT:
            Ref: GatewayEndpoint
          ENABLE_ZONE_OMIT:
            Ref: EnableZoneOmission
          ZONE_OMIT_TAG:
            Ref: ZoneSyncTag
          SYNC_DEST:
            Ref: SyncDestination
          SYNC_BUCKET:
            Ref: SyncBucket
    Metadata:
      SamResourceId: SnapshotFunction
  SnapshotListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SnapshotListFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/74a526d073b785d17d7ed62ded6512d9
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 60
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - route53:ListHostedZones
          - route53:ListTagsForResources
          Resource: '*'
      Layers:
      - Ref: SharedLayer
    Metadata:
      SamResourceId: SnapshotListFunction
  SnapshotStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SnapshotStateMachineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SnapshotInvokePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - SnapshotFunction
              - Arn
            - Fn::GetAtt:
              - SnapshotListFunction
              - Arn
            - Fn::Sub: ${SnapshotFunction.Arn}:*
            - Fn::Sub: ${SnapshotListFunction.Arn}:*
    Metadata:
      SamResourceId: SnapshotStateMachineRole
  SnapshotStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: Snapshot-Route53
      RoleArn:
        Fn::GetAtt:
        - SnapshotStateMachineRole
        - Arn
      Definition:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/b4087431f741a819f4ca92cb5e75961e
    Metadata:
      SamResourceId: SnapshotStateMachine
  TriggerStateMachineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TriggerStateMachineFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/ff3afe3a98f56f7f268d49bb15a82333
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 60
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: states:StartExecution
          Resource:
            Fn::GetAtt:
            - SnapshotStateMachine
            - Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Fn::GetAtt:
            - SnapshotStateMachine
            - Arn
    Metadata:
      SamResourceId: TriggerStateMachineFunction
  TriggerSnapshotCR:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - TriggerStateMachineFunction
        - Arn
    DependsOn: SnapshotStateMachine
    Metadata:
      SamResourceId: TriggerSnapshotCR
