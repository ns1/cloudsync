AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: This serverless application publishes AWS Route 53 events to NS1 Connect.
Globals:
  Function:
    Timeout: 60
    Runtime: python3.13
    Tracing: Active
  Api:
    TracingEnabled: true
Metadata:
  AWS::ServerlessRepo::Application:
    Name: aws-route53-ns1-connect
    Description: This serverless application publishes AWS Route 53 events to NS1
      Connect.
    Author: NS1
    SpdxLicenseId: Apache-2.0
    LicenseUrl: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/86d3f3a95c324c9479bd8986968f4327
    ReadmeUrl: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/3eaeaf31301e196795e809ed39e5d230
    Labels:
    - serverless
    - NS1
    - Route53
    - DNS
    HomePageUrl: https://github.com/ns1/cloudsync
    SemanticVersion: '0.4.7'
    SourceCodeUrl: https://github.com/ns1/cloudsync/tree/0.4.7
Parameters:
  CreateCloudTrail:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: 'Controls whether this stack creates a dedicated CloudTrail trail.
      Set to "false" if your AWS account already has an existing active CloudTrail
      trail. The trail must be capturing Route 53 management events and delivering
      them to EventBridge. If DNS sync stops working after setting this to "false",
      your existing trail may not be configured correctly - set to "true" to have
      this stack create a dedicated trail with the correct settings. Set to "true"
      if you are unsure or if your account has no existing trail.

      '
  CloudTrailName:
    Type: String
    Default: NS1CloudSyncTrail
    AllowedPattern: ^(?!management-events$)(?!aws-controltower-BaselineCloudTrail$)(?!AccountTrail$).+
    ConstraintDescription: CloudTrailName must not be the name of an existing system
      or organization trail (e.g. management-events, aws-controltower-BaselineCloudTrail,
      AccountTrail). Leave as default (NS1CloudSyncTrail) unless you have a specific
      reason to change it.
    Description: "ONLY USED when CreateCloudTrail is \"true\" \u2014 ignored otherwise,\
      \ leave as default. Name for the new CloudTrail trail created by this stack.\
      \ WARNING: Do not set this to the name of an existing trail such as \"management-events\"\
      \ \u2014 this stack will delete the trail when it is removed or when CreateCloudTrail\
      \ is changed to \"false\"."
  NS1APIKey:
    Type: String
    Description: NS1 account API key.
  DLQAlarmNotificationArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN to notify when Route 53 update messages land
      in the dead-letter queue (CloudSyncUpdatesDLQueue). Leave blank to skip notifications;
      the alarm is still visible in CloudWatch either way.
Conditions:
  HasDLQAlarmNotification:
    Fn::Not:
    - Fn::Equals:
      - Ref: DLQAlarmNotificationArn
      - ''
  ShouldCreateTrail:
    Fn::Equals:
    - Ref: CreateCloudTrail
    - 'true'
Resources:
  Route53NSUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Route53NSUpdaterRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:aws:iam::761018877004:role/processorIAMRole-prod
          Action: sts:AssumeRole
      Policies:
      - PolicyName: Route53NSUpdaterRolePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - route53:ChangeResourceRecordSets
            Resource: arn:aws:route53:::hostedzone/*
            Condition:
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsRecordTypes:
                - NS
    Metadata:
      SamResourceId: Route53NSUpdaterRole
  UpdatesDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CloudSyncUpdatesDLQueue
      MessageRetentionPeriod: 1209600
    Metadata:
      SamResourceId: UpdatesDeadLetterQueue
  DNSUpdateQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CloudSyncUpdatesQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - UpdatesDeadLetterQueue
          - Arn
        maxReceiveCount: 5
    Metadata:
      SamResourceId: DNSUpdateQueue
  UpdatesDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: CloudSyncUpdatesDLQueueNotEmpty
      AlarmDescription: One or more Route 53 update messages failed delivery to NS1
        and landed in CloudSyncUpdatesDLQueue for investigation.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - UpdatesDeadLetterQueue
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        Fn::If:
        - HasDLQAlarmNotification
        - - Ref: DLQAlarmNotificationArn
        - Ref: AWS::NoValue
    Metadata:
      SamResourceId: UpdatesDeadLetterQueueAlarm
  TrailKMSKey:
    Type: AWS::KMS::Key
    Condition: ShouldCreateTrail
    Properties:
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Id: default-key-policy
        Statement:
        - Sid: Enable IAM User Permissions
          Effect: Allow
          Action:
          - kms:*
          Principal:
            AWS:
              Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
          Resource: '*'
        - Sid: Allow CloudTrail to encrypt logs
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action:
          - kms:GenerateDataKey*
          Resource: '*'
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/${CloudTrailName}
            StringLike:
              kms:EncryptionContext:aws:cloudtrail:arn:
                Fn::Sub: arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
        - Sid: Allow CloudTrail to describe key
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action:
          - kms:DescribeKey
          Resource: '*'
        - Sid: Allow principals in the account to decrypt log files
          Effect: Allow
          Principal:
            AWS: '*'
          Action:
          - kms:Decrypt
          - kms:ReEncryptFrom
          Resource: '*'
          Condition:
            StringEquals:
              kms:CallerAccount:
                Fn::Sub: ${AWS::AccountId}
            StringLike:
              kms:EncryptionContext:aws:cloudtrail:arn:
                Fn::Sub: arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
        - Sid: Allow alias creation during setup
          Effect: Allow
          Principal:
            AWS: '*'
          Action:
          - kms:CreateAlias
          Resource: '*'
          Condition:
            StringEquals:
              kms:CallerAccount:
                Fn::Sub: ${AWS::AccountId}
              kms:ViaService: ec2.us-east-1.amazonaws.com
        - Sid: Enable cross account log decryption
          Effect: Allow
          Principal:
            AWS: '*'
          Action:
          - kms:Decrypt
          - kms:ReEncryptFrom
          Resource: '*'
          Condition:
            StringEquals:
              kms:CallerAccount:
                Fn::Sub: ${AWS::AccountId}
            StringLike:
              kms:EncryptionContext:aws:cloudtrail:arn:
                Fn::Sub: arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
    Metadata:
      SamResourceId: TrailKMSKey
  TrailS3Bucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateTrail
    DeletionPolicy: Delete
    Properties:
      BucketName:
        Fn::Join:
        - '-'
        - - cloudsync-trail-bucket
          - Fn::Select:
            - 4
            - Fn::Split:
              - '-'
              - Fn::Select:
                - 2
                - Fn::Split:
                  - /
                  - Ref: AWS::StackId
    Metadata:
      SamResourceId: TrailS3Bucket
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateTrail
    Properties:
      Bucket:
        Ref: TrailS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: Check ACLs
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:GetBucketAcl
          Resource:
            Fn::GetAtt:
            - TrailS3Bucket
            - Arn
          Condition:
            StringEquals:
              aws:SourceArn:
                Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/${CloudTrailName}
        - Sid: Write Access
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:PutObject
          Resource:
            Fn::Sub:
            - arn:aws:s3:::${Bucket}/AWSLogs/${AWS::AccountId}/*
            - Bucket:
                Ref: TrailS3Bucket
          Condition:
            StringEquals:
              s3:x-amz-acl: bucket-owner-full-control
    Metadata:
      SamResourceId: TrailBucketPolicy
  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: ShouldCreateTrail
    DependsOn: TrailBucketPolicy
    Properties:
      S3BucketName:
        Ref: TrailS3Bucket
      IsLogging: true
      TrailName:
        Ref: CloudTrailName
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      KMSKeyId:
        Fn::GetAtt:
        - TrailKMSKey
        - Arn
    Metadata:
      SamResourceId: Trail
  EventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        account:
        - Fn::Sub: ${AWS::AccountId}
        source:
        - aws.route53
        detail:
          eventSource:
          - route53.amazonaws.com
          eventName:
          - CreateHostedZone
          - DeleteHostedZone
          - UpdateHostedZoneComment
          - ChangeResourceRecordSets
          - ChangeTagsForResource
          - CreateHealthCheck
          - DeleteHealthCheck
          - UpdateHealthCheck
          - ChangeCidrCollection
          - DeleteCidrCollection
          errorCode:
          - exists: false
      Targets:
      - Arn:
          Fn::GetAtt:
          - DNSUpdateQueue
          - Arn
        Id: DNSUpdateQueue
    Metadata:
      SamResourceId: EventRule
  EventBridgeToUpdateQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: DNSUpdateQueue
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action:
          - SQS:SendMessage
          Resource:
            Fn::GetAtt:
            - DNSUpdateQueue
            - Arn
    Metadata:
      SamResourceId: EventBridgeToUpdateQueuePolicy
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: CloudSyncSharedLayer
      Description: Common functions
      ContentUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/7f2d22c1e1577fcaf8f468dff575428a
      CompatibleRuntimes:
      - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11
      SamResourceId: SharedLayer
  DNSUpdateFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CloudSyncUpdateFunctionPolicy
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey*
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken*
          - Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - UpdatesDeadLetterQueue
              - Arn
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - DNSUpdateQueue
              - Arn
          - Effect: Allow
            Action:
            - route53:GetHostedZone
            - route53:ListHostedZones
            - route53:ListResourceRecordSets
            - route53:ListTagsForResources
            Resource: '*'
          - Effect: Allow
            Action:
            - route53:ListTagsForResource
            Resource: '*'
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              Fn::GetAtt:
              - SnapshotStateMachine
              - Arn
    Metadata:
      SamResourceId: DNSUpdateFunctionRole
  EventLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: DNSUpdateFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - EventRule
        - Arn
    Metadata:
      SamResourceId: EventLambdaInvokePermission
  DNSUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncDNSUpdateFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/9064bd10d6c241c5ed31165b8fea80cb
      Handler: app.handler
      Timeout: 10
      Role:
        Fn::GetAtt:
        - DNSUpdateFunctionRole
        - Arn
      Environment:
        Variables:
          ENDPOINT: https://api.nsone.net/cloudsync/v1beta1
          ACCOUNT_ID:
            Ref: AWS::AccountId
          ENABLE_ZONE_OMIT: true
          ZONE_SYNC_TAG: NS1CloudSync
          SYNC_DEST: ns1
          STATE_MACHINE_ARN:
            Fn::GetAtt:
            - SnapshotStateMachine
            - Arn
      Layers:
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
      - Ref: SharedLayer
      Events:
        UpdateQueueEvent:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - DNSUpdateQueue
              - Arn
            BatchSize: 5
            FunctionResponseTypes:
            - ReportBatchItemFailures
    Metadata:
      SamResourceId: DNSUpdateFunction
  ConfigureFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CloudSyncConfigFunctionPolicy
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            - secretsmanager:DeleteSecret
            - secretsmanager:TagResource
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*
          - Effect: Allow
            Action: cloudformation:DescribeStackResources
            Resource:
              Fn::Sub: arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Effect: Allow
            Action: logs:DeleteLogGroup
            Resource:
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*ConfigureFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*SnapshotFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*SnapshotListFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*TriggerStateMachineFunction*
            - Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*DNSUpdateFunction*
          - Effect: Allow
            Action:
            - s3:ListAllMyBuckets
            Resource: '*'
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
            Resource:
              Fn::Sub: arn:aws:s3:::cloudsync-trail-bucket-*
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
            Resource:
              Fn::Sub: arn:aws:s3:::cloudsync-trail-bucket-*/*
          - Effect: Allow
            Action:
            - cloudtrail:StopLogging
            - cloudtrail:DeleteTrail
            Resource:
              Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/*
    Metadata:
      SamResourceId: ConfigureFunctionRole
  ConfigureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncConfigureFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/d6730cfc348ef8872b83e20dfe821fba
      Handler: app.configure_application
      Timeout: 300
      Role:
        Fn::GetAtt:
        - ConfigureFunctionRole
        - Arn
      Layers:
      - Ref: SharedLayer
      Environment:
        Variables:
          NS1_API_KEY:
            Ref: NS1APIKey
          CLOUDSYNC_API_KEY: ''
          STACK_NAME:
            Ref: AWS::StackName
    Metadata:
      SamResourceId: ConfigureFunction
  ConfigureCustomResource:
    Type: Custom::ConfigureFunction
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - ConfigureFunction
        - Arn
      CloudTrailBucketName:
        Fn::If:
        - ShouldCreateTrail
        - Ref: TrailS3Bucket
        - ''
      CloudTrailName:
        Ref: CloudTrailName
      CreateCloudTrail:
        Ref: CreateCloudTrail
    Metadata:
      SamResourceId: ConfigureCustomResource
  SnapshotFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudSyncSnapshotFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CloudSyncSnapshotFunctionPolicy
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - route53:GetHostedZone
            - route53:ListHostedZones
            - route53:ListResourceRecordSets
            - route53:ListTagsForResources
            Resource: '*'
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*
    Metadata:
      SamResourceId: SnapshotFunctionRole
  SnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncSnapshotFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/041e041f9af7e088e3db9d8a6ee276b4
      Handler: app.lambda_handler
      Role:
        Fn::GetAtt:
        - SnapshotFunctionRole
        - Arn
      Layers:
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
      - Ref: SharedLayer
      Environment:
        Variables:
          ACCOUNT_ID:
            Ref: AWS::AccountId
          ENDPOINT: https://api.nsone.net/cloudsync/v1beta1
          ENABLE_ZONE_OMIT: true
          ZONE_SYNC_TAG: NS1CloudSync
          SYNC_DEST: ns1
          SYNC_BUCKET: ''
    Metadata:
      SamResourceId: SnapshotFunction
  SnapshotListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncSnapshotListFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/4f6d7e88371af97e53e996cda717168c
      Handler: app.lambda_handler
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - route53:ListHostedZones
          - route53:ListTagsForResources
          Resource: '*'
      Layers:
      - Ref: SharedLayer
    Metadata:
      SamResourceId: SnapshotListFunction
  HealthCheckSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncHCSnapshotFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/6586f78f236604c908eb1a488648dc59
      Handler: app.lambda_handler
      Role:
        Fn::GetAtt:
        - HCSnapshotFunctionRole
        - Arn
      Layers:
      - Ref: SharedLayer
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
      Environment:
        Variables:
          ACCOUNT_ID:
            Ref: AWS::AccountId
          ENDPOINT: https://api.nsone.net/cloudsync/v1beta1
          SYNC_DEST: ns1
    Metadata:
      SamResourceId: HealthCheckSnapshotFunction
  HCSnapshotFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudSyncHCSnapshotFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CloudSyncHealthChecksSnapshotPolicy
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - route53:ListHealthChecks
            Resource: '*'
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*
    Metadata:
      SamResourceId: HCSnapshotFunctionRole
  SnapshotStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudSyncSnapshotStateMachineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CloudSyncSnapshotStateMachinePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - SnapshotFunction
              - Arn
            - Fn::GetAtt:
              - SnapshotListFunction
              - Arn
            - Fn::GetAtt:
              - HealthCheckSnapshotFunction
              - Arn
            - Fn::Sub: ${SnapshotFunction.Arn}:*
            - Fn::Sub: ${SnapshotListFunction.Arn}:*
            - Fn::Sub: ${HealthCheckSnapshotFunction.Arn}:*
    Metadata:
      SamResourceId: SnapshotStateMachineRole
  SnapshotStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: CloudSyncSnapshotStateMachine
      RoleArn:
        Fn::GetAtt:
        - SnapshotStateMachineRole
        - Arn
      DefinitionString:
        Fn::Sub: "{\n  \"Comment\": \"Snapshot Iterator\",\n  \"StartAt\": \"Health\
          \ Check Snapshot\",\n  \"States\": {\n    \"Health Check Snapshot\": {\n\
          \      \"Type\": \"Task\",\n      \"Resource\": \"arn:aws:states:::lambda:invoke\"\
          ,\n      \"OutputPath\": \"$.Payload\",\n      \"Parameters\": {\n     \
          \   \"Payload.$\": \"$\",\n        \"FunctionName\": \"${HealthCheckSnapshotFunction.Arn}\"\
          \n      },\n      \"Retry\": [\n        {\n          \"ErrorEquals\": [\n\
          \            \"Lambda.ServiceException\",\n            \"Lambda.AWSLambdaException\"\
          ,\n            \"Lambda.SdkClientException\",\n            \"Lambda.TooManyRequestsException\"\
          \n          ],\n          \"IntervalSeconds\": 1,\n          \"MaxAttempts\"\
          : 3,\n          \"BackoffRate\": 2,\n          \"JitterStrategy\": \"FULL\"\
          \n        }\n      ],\n      \"Next\": \"List Hosted Zones\"\n    },\n \
          \   \"Done\": {\n      \"End\": true,\n      \"Type\": \"Pass\"\n    },\n\
          \    \"List Hosted Zones\": {\n      \"Next\": \"Hosted Zones Snapshot\"\
          ,\n      \"OutputPath\": \"$.Payload\",\n      \"Parameters\": {\n     \
          \   \"FunctionName\": \"${SnapshotListFunction.Arn}\",\n        \"Payload.$\"\
          : \"$\"\n      },\n      \"Resource\": \"arn:aws:states:::lambda:invoke\"\
          ,\n      \"Retry\": [\n        {\n          \"BackoffRate\": 2,\n      \
          \    \"ErrorEquals\": [\n            \"Lambda.ServiceException\",\n    \
          \        \"Lambda.AWSLambdaException\",\n            \"Lambda.SdkClientException\"\
          ,\n            \"Lambda.TooManyRequestsException\"\n          ],\n     \
          \     \"IntervalSeconds\": 1,\n          \"MaxAttempts\": 3\n        }\n\
          \      ],\n      \"Type\": \"Task\"\n    },\n    \"Wait\": {\n      \"Next\"\
          : \"Hosted Zones Snapshot\",\n      \"Seconds\": 1,\n      \"Type\": \"\
          Wait\"\n    },\n    \"isTruncated\": {\n      \"Choices\": [\n        {\n\
          \          \"Next\": \"Wait\",\n          \"Or\": [\n            {\n   \
          \           \"NumericLessThanPath\": \"$.iterator.zones_count\",\n     \
          \         \"Variable\": \"$.iterator.current_zone_index\"\n            },\n\
          \            {\n              \"And\": [\n                {\n          \
          \        \"IsPresent\": true,\n                  \"Variable\": \"$.iterator.IsTruncated\"\
          \n                },\n                {\n                  \"BooleanEquals\"\
          : true,\n                  \"Variable\": \"$.iterator.IsTruncated\"\n  \
          \              }\n              ]\n            }\n          ]\n        }\n\
          \      ],\n      \"Default\": \"Done\",\n      \"Type\": \"Choice\"\n  \
          \  },\n    \"Hosted Zones Snapshot\": {\n      \"Next\": \"isTruncated\"\
          ,\n      \"Resource\": \"${SnapshotFunction.Arn}\",\n      \"ResultPath\"\
          : \"$.iterator\",\n      \"Type\": \"Task\"\n    }\n  }\n}\n"
    Metadata:
      SamResourceId: SnapshotStateMachine
  TriggerStateMachineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncTriggerStateMachineFunction
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-5bpg79c8x6lw/d144bf65e29a2a05b8900d4248a74b2e
      Handler: app.lambda_handler
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: states:StartExecution
          Resource:
            Fn::GetAtt:
            - SnapshotStateMachine
            - Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Fn::GetAtt:
            - SnapshotStateMachine
            - Arn
    Metadata:
      SamResourceId: TriggerStateMachineFunction
  TriggerSnapshotCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - TriggerStateMachineFunction
        - Arn
    DependsOn: SnapshotStateMachine
    Metadata:
      SamResourceId: TriggerSnapshotCustomResource
Outputs:
  CloudTrailStatus:
    Description: 'Whether this stack created a CloudTrail trail. If "Not managed by
      this stack", ensure your account has an existing active CloudTrail trail that
      captures Route 53 management events. If DNS sync stops working, your existing
      trail may not be configured correctly - redeploy with CreateCloudTrail=true.
      If upgrading from a previous version that created its own trail: the old trail
      has been stopped and deleted, but the S3 log bucket (cloudsync-trail-bucket-*)
      has been retained. Check the RetainedCloudTrailBucket output for the bucket
      name. Once you have verified DNS sync is working, empty and delete the bucket
      manually to stop incurring storage charges.'
    Value:
      Fn::If:
      - ShouldCreateTrail
      - Fn::Sub: 'Created and managed by this stack: ${Trail}'
      - Not managed by this stack - ensure your existing trail captures Route 53 management
        events
  EventBridgeRuleArn:
    Description: ARN of the EventBridge rule that captures Route 53 events
    Value:
      Fn::GetAtt:
      - EventRule
      - Arn
  DNSUpdateQueueUrl:
    Description: URL of the SQS queue receiving Route 53 change events
    Value:
      Fn::GetAtt:
      - DNSUpdateQueue
      - QueueUrl
  DNSUpdateFunctionArn:
    Description: ARN of the Lambda function processing Route 53 change events
    Value:
      Fn::GetAtt:
      - DNSUpdateFunction
      - Arn
  RetainedCloudTrailBucket:
    Description: Name of the CloudTrail log bucket retained after upgrading from a
      version that created a trail. This bucket is no longer needed and can be safely
      deleted to stop incurring storage charges. If no bucket was retained during
      this deployment, this value will be empty.
    Value:
      Fn::GetAtt:
      - ConfigureCustomResource
      - RetainedCloudTrailBucket
