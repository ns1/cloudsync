AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: This serverless application publishes AWS Route 53 events to NS1 Connect.

Globals:
  Function:
    Timeout: 60
    Runtime: python3.11
    Tracing: Active
  Api:
    TracingEnabled: True

Metadata:
  AWS::ServerlessRepo::Application:
    Name: aws-route53-ns1-connect
    Description: This serverless application publishes AWS Route 53 events to NS1 Connect.
    Author: NS1
    SpdxLicenseId: Apache-2.0
    # paths are relative to .aws-sam/build directory
    LicenseUrl: ../../LICENSE
    ReadmeUrl: ./README.md
    Labels: [serverless, NS1, Route53, DNS]
    HomePageUrl: https://github.com/ns1/cloudsync
    SemanticVersion: 0.4.2
    SourceCodeUrl: https://github.com/ns1/cloudsync/tree/0.4.2

Parameters:
  CloudTrailName:
    Type: String
    Default: NS1CloudSyncTrail
  NS1APIKey:
    Type: String
    Description: NS1 account API key.


Resources:
  UpdatesDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CloudSyncUpdatesDLQueue

  DNSUpdateQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CloudSyncUpdatesQueue

  # KMS key for CloudTrail S3 bucket.
  TrailKMSKey:
    Type: AWS::KMS::Key
    Properties: 
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Id: default-key-policy
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: Allow
            Action: 
              - kms:*
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Resource: "*"
          - Sid: "Allow CloudTrail to encrypt logs"
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/${CloudTrailName}
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
          - Sid: "Allow CloudTrail to describe key"
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 
              - kms:DescribeKey
            Resource: "*"
          - Sid: "Allow principals in the account to decrypt log files"
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:Decrypt
              - kms:ReEncryptFrom
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub ${AWS::AccountId}
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*
          - Sid: "Allow alias creation during setup"
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:CreateAlias
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub ${AWS::AccountId}
                kms:ViaService: ec2.us-east-1.amazonaws.com
          - Sid: "Enable cross account log decryption"
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:Decrypt
              - kms:ReEncryptFrom
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub ${AWS::AccountId}
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*

  # S3 bucket for CloudTrail.
  TrailS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Join ['-', ['cloudsync-trail-bucket', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]

  # Bucket policy to allow CloudTrail access to the bucket.
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Check ACLs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailS3Bucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/${CloudTrailName}
          - Sid: Write Access
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub 
              - arn:aws:s3:::${Bucket}/AWSLogs/${AWS::AccountId}/*
              - Bucket: !Ref TrailS3Bucket
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  # There must be a trail in order for EventBridge to capture events from Route 53.
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      S3BucketName: !Ref TrailS3Bucket
      IsLogging: true
      TrailName: !Ref CloudTrailName
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      KMSKeyId: !GetAtt TrailKMSKey.Arn

  # An EventBridge rule that queues all Route 53 updates from CloudTrail.
  EventRule: 
    Type: AWS::Events::Rule
    Properties: 
      EventPattern: 
        account: 
          - !Sub '${AWS::AccountId}'
        source:
          - aws.route53
        detail:
          eventSource:
            - route53.amazonaws.com
          eventName:
            - CreateHostedZone
            - DeleteHostedZone
            - UpdateHostedZoneComment
            - ChangeResourceRecordSets
            - ChangeTagsForResource
            - CreateHealthCheck
            - DeleteHealthCheck
            - UpdateHealthCheck
            - ChangeCidrCollection
            - DeleteCidrCollection
          errorCode:
            - exists: false
      Targets: 
        - Arn: !GetAtt DNSUpdateQueue.Arn
          Id: DNSUpdateQueue

  # A policy that allows the EventBridge rule to send messages to the update queue.
  EventBridgeToUpdateQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: DNSUpdateQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 
              - SQS:SendMessage
            Resource:  !GetAtt DNSUpdateQueue.Arn

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: CloudSyncSharedLayer
      Description: Common functions
      ContentUri: ./src/shared_layer
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11
  
  DNSUpdateFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudSyncUpdateFunctionPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt UpdatesDeadLetterQueue.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt DNSUpdateQueue.Arn
              - Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListHostedZones
                  - route53:ListResourceRecordSets
                  - route53:ListTagsForResources
                Resource: "*"
              - Effect: Allow
                Action:
                  - route53:ListTagsForResource
                Resource: "*"
              - Effect: "Allow"
                Action: states:StartExecution
                Resource: !GetAtt SnapshotStateMachine.Arn

  EventLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DNSUpdateFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventRule.Arn

  # A Lambda residing in this account that receives updates from Route 53 via CloudTrail.
  DNSUpdateFunction:
      Type: AWS::Serverless::Function
      Properties:
        FunctionName: CloudSyncDNSUpdateFunction
        CodeUri: ./src/dns_updates
        Handler: app.handler
        Role: !GetAtt DNSUpdateFunctionRole.Arn
        Environment:
          Variables:
            ENDPOINT: https://api.nsone.net/cloudsync/v1beta1
            ACCOUNT_ID: !Ref AWS::AccountId
            ENABLE_ZONE_OMIT: true
            ZONE_SYNC_TAG: NS1CloudSync
            SYNC_DEST: ns1
            STATE_MACHINE_ARN: !GetAtt SnapshotStateMachine.Arn
        Layers:
          - !Sub arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
          - !Ref SharedLayer
        EventInvokeConfig:
          MaximumRetryAttempts: 2
        Events:
          UpdateQueueEvent:
            Type: SQS
            Properties:
              Queue: !GetAtt DNSUpdateQueue.Arn
              BatchSize: 5

  ConfigureFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudSyncConfigFunctionPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                Resource: 
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*'
              - Effect: Allow
                Action: cloudformation:DescribeStackResources
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action: logs:DeleteLogGroup
                Resource: 
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*ConfigureFunction*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*SnapshotFunction*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*SnapshotListFunction*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*TriggerStateMachineFunction*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*DNSUpdateFunction*'
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource: !GetAtt TrailS3Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource: !Sub 
                  - arn:aws:s3:::${Bucket}/*
                  - Bucket: !Ref TrailS3Bucket
 
  ConfigureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncConfigureFunction
      CodeUri: src/configure
      Handler: app.configure_application
      Timeout: 300
      Role: !GetAtt ConfigureFunctionRole.Arn
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          NS1_API_KEY: !Ref NS1APIKey
          CLOUDSYNC_API_KEY: ""
          STACK_NAME: !Ref "AWS::StackName" 
  
  ConfigureCustomResource:
    Type: Custom::ConfigureFunction
    Properties:
      ServiceToken: !GetAtt ConfigureFunction.Arn
      CloudTrailBucketName: !Ref TrailS3Bucket
  
  SnapshotFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudSyncSnapshotFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudSyncSnapshotFunctionPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListHostedZones
                  - route53:ListResourceRecordSets
                  - route53:ListTagsForResources
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*'
  
  SnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncSnapshotFunction
      CodeUri: ./src/dns_snapshot
      Handler: app.lambda_handler
      Role: !GetAtt SnapshotFunctionRole.Arn
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
        - !Ref SharedLayer
      Environment:
          Variables:
            ENDPOINT: https://api.nsone.net/cloudsync/v1beta1
            ENABLE_ZONE_OMIT: true
            ZONE_OMIT_TAG: NS1CloudSync
            SYNC_DEST: ns1
            SYNC_BUCKET: ""

  SnapshotListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncSnapshotListFunction
      CodeUri: ./src/dns_snapshot_list
      Handler: app.lambda_handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
               - route53:ListHostedZones
               - route53:ListTagsForResources
              Resource: "*"
      Layers:
        - !Ref SharedLayer

  HealthCheckSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncHCSnapshotFunction
      CodeUri: ./src/hc_snapshot
      Handler: app.lambda_handler
      Role: !GetAtt HCSnapshotFunctionRole.Arn
      Layers:
        - !Ref SharedLayer
        - !Sub arn:aws:lambda:${AWS::Region}:177933569100:layer:AWS-Parameters-and-Secrets-Lambda-Extension:4
      Environment:
          Variables:
            ACCOUNT_ID: !Ref AWS::AccountId
            ENDPOINT: https://api.nsone.net/cloudsync/v1beta1
            SYNC_DEST: ns1

  HCSnapshotFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudSyncHCSnapshotFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudSyncHealthChecksSnapshotPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - route53:ListHealthChecks
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/CloudSyncAPIKey-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/NS1APIKey-*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/RefreshToken-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CloudSync/AccessToken-*'
                  
  SnapshotStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudSyncSnapshotStateMachineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudSyncSnapshotStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt SnapshotFunction.Arn
                  - !GetAtt SnapshotListFunction.Arn
                  - !GetAtt HealthCheckSnapshotFunction.Arn
                  - !Sub ${SnapshotFunction.Arn}:*
                  - !Sub ${SnapshotListFunction.Arn}:*
                  - !Sub ${HealthCheckSnapshotFunction.Arn}:*
                  
  SnapshotStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: CloudSyncSnapshotStateMachine
      RoleArn: !GetAtt SnapshotStateMachineRole.Arn
      DefinitionString: 
        !Sub |
          {
            "Comment": "Snapshot Iterator",
            "StartAt": "Health Check Snapshot",
            "States": {
              "Health Check Snapshot": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "OutputPath": "$.Payload",
                "Parameters": {
                  "Payload.$": "$",
                  "FunctionName": "${HealthCheckSnapshotFunction.Arn}"
                },
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException"
                    ],
                    "IntervalSeconds": 1,
                    "MaxAttempts": 3,
                    "BackoffRate": 2,
                    "JitterStrategy": "FULL"
                  }
                ],
                "Next": "List Hosted Zones"
              },
              "Done": {
                "End": true,
                "Type": "Pass"
              },
              "List Hosted Zones": {
                "Next": "Hosted Zones Snapshot",
                "OutputPath": "$.Payload",
                "Parameters": {
                  "FunctionName": "${SnapshotListFunction.Arn}",
                  "Payload.$": "$"
                },
                "Resource": "arn:aws:states:::lambda:invoke",
                "Retry": [
                  {
                    "BackoffRate": 2,
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException"
                    ],
                    "IntervalSeconds": 1,
                    "MaxAttempts": 3
                  }
                ],
                "Type": "Task"
              },
              "Wait": {
                "Next": "Hosted Zones Snapshot",
                "Seconds": 1,
                "Type": "Wait"
              },
              "isTruncated": {
                "Choices": [
                  {
                    "Next": "Wait",
                    "Or": [
                      {
                        "NumericLessThanPath": "$.iterator.zones_count",
                        "Variable": "$.iterator.current_zone_index"
                      },
                      {
                        "And": [
                          {
                            "IsPresent": true,
                            "Variable": "$.iterator.IsTruncated"
                          },
                          {
                            "BooleanEquals": true,
                            "Variable": "$.iterator.IsTruncated"
                          }
                        ]
                      }
                    ]
                  }
                ],
                "Default": "Done",
                "Type": "Choice"
              },
              "Hosted Zones Snapshot": {
                "Next": "isTruncated",
                "Resource": "${SnapshotFunction.Arn}",
                "ResultPath": "$.iterator",
                "Type": "Task"
              }
            }
          }

  TriggerStateMachineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudSyncTriggerStateMachineFunction
      CodeUri: ./src/trigger_state_machine
      Handler: app.lambda_handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Action: states:StartExecution
              Resource: !GetAtt SnapshotStateMachine.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !GetAtt SnapshotStateMachine.Arn

  TriggerSnapshotCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt TriggerStateMachineFunction.Arn
    DependsOn: SnapshotStateMachine